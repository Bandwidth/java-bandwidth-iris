name: Build and Test Package using Maven
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        distribution: 'adopt'
        java-version: '11'

    - name: Build and Test
      run: mvn -B package --file pom.xml
